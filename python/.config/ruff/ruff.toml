extend-exclude = ["*drafts*.py"]
line-length = 79
output-prefer-rule-codes = true
show-fixes = true

[lint]
ignore = [
  # "DOC",  # pydoclint is already handling docstring issues.
  # "F401",  # F401: module imported but unused
  # "D100",  # Missing docstring in public module"
  # "D103",  # undocumented-public-method
  "D105",  # undocumented-magic-method
  "D401",  # non-imperative-mood
  "PLW0131",  # marimo: walrus
  "B018",  # marimo: useless expressions
]
extend-select = [
  "ARG",  # flake8-unused-arguments
  "B",  # flake8-bugbear
  "EM",  # flake8-errmsg
  "G",  # flake8-logging-format
  "ISC",  # flake8-implicit-str-concat
  "Q",  # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific
  "NPY",  # numpy
  # "D",  # docstring # handled by format-docstring and pydoclint
  "C4",  # flake8-comprehensions
  "N",  # pep8-naming
  "ICN",  # flake8-import-conventions
  "PTH",  # flake8-use-pathlib
  "SIM",  # flake8-simplify
  "EXE",  # flake8-executable
  "FURB110",
  "FURB116",
  "FURB167",
  "FURB177",
  "B903",
  "TRY300",
  "LOG004",
  "LOG007",
  "UP042",
  "PERF403",
  "PERF401",
  #############
  # Preview rules
  "FURB113",
  "FURB152",
  "FURB156",
  #############
  #############
  # Enable the following when working on spaghetti and old code.
  # "FURB",
  # "UP",
  #############
]
# There are certain `preview`/beta rules that I am selectively enabling.
preview = true
explicit-preview-rules = true
external = [
  "DOC105",
  "DOC601",
  "DOC603",
]

[lint.pydocstyle]
convention = "numpy"

[format]
docstring-code-format = true
