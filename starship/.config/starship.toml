# Set these env variables for displaying in prompt.
[env_var.__STARSHIP_DISPLAY_1]
default = ""
symbol = '\$'
format = "[$symbol$env_value]($style) "
disabled = false
style = "purple bold"

[env_var.__STARSHIP_DISPLAY_2]
default = ""
symbol = '\$'
format = "[$symbol$env_value]($style) "
disabled = false
style = "dimmed_fg bold"
