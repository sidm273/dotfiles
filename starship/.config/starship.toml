# Use the color palette
palette = "dracula"

# Define Dracula color palette
[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
dimmed_fg = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"

# Get editor completions based on the config schema
# Does not work in neovim by default without any configuration.
# "$schema" = 'https://starship.rs/config-schema.json'

[character]
# success_symbol = "[λ ](bold green)"
# success_symbol = "[❯ ](bold green)" # default
success_symbol = "[󰅂 ](bold green)"  # nf-md-chevron_right
# error_symbol = '[✗](bold red)'
error_symbol = "[✖ ](bold red)"
# error_symbol = '[ ](bold red)' # nf-fa-xmark
# vimcmd_symbol = '[V](bold green)'
vimcmd_symbol = "[ ](bold green)"

[cmd_duration]
min_time = 5_000  # ms
style = "bold yellow"

[directory]
style = "bold green"
truncation_length = 10
read_only = " 󰌾"

[git_branch]
style = "bold pink"
symbol = " "

[git_status]
style = "bold red"
deleted = "󰆴 "
untracked = " "
stashed = "󰆼 "
behind = "󰭽 "
ahead = "󰭾 "
up_to_date = "󰸞 "  # nf-md-check_bold
conflicted = "󰞇 "  # nf-md-sword-cross
modified = " "  # nf-oct-file_diff
staged = '[++\($count\)](green)'
# staged      = "󰐕 "   # nf-md-plus_circle

[git_commit]
tag_symbol = "  "
tag_disabled = false

[hostname]
ssh_only = false
style = "bold purple"
ssh_symbol = " "

[username]
format = "[$user]($style) on "
style_user = "bold cyan"

[os]
style = "bold purple"
disabled = true

