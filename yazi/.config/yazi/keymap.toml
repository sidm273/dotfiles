[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd $ZID_DOT"
desc = "cd to $ZID_DOT"

[[mgr.prepend_keymap]]
on = ["g", "e"]
run = "cd $ZID_ECORP"
desc = "cd to $ZID_ECORP"

[[mgr.prepend_keymap]]
on = ["g", "o"]
run = "cd $ZID_OFILES"
desc = "cd to $ZID_OFILES"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd $ZID_EFILES"
desc = "cd to $ZID_EFILES"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = "cd /"
desc = "cd to /"

[[mgr.prepend_keymap]]
on = "+"
run = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on = "-"
run = "plugin zoom -1"
desc = "Zoom out hovered file"

[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on = "<C-d>"
run = "plugin diff"
desc = "Diff the selected with the hovered file"
