[mgr]
show_hidden = true
show_symlink = true
ratio = [1, 3, 4]  # [ 1, 4, 3 ] # default

[preview]
wrap = "no"
max_width = 900
max_height = 900
image_delay = 50

[opener]
edit = [
  { run = "$EDITOR %s", block = true, for = "unix" },
  { run = "%EDITOR% %s", block = true, for = "windows" },
]
extract = [
  { run = "ouch d -y %*", desc = "Extract here with ouch", for = "windows" },
  { run = 'ouch d -y "$@"', desc = "Extract here with ouch", for = "unix" },
]

[plugin]
prepend_previewers = [
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },
  { url = "*.csv", run = "duckdb" },
  { url = "*.tsv", run = "duckdb" },
  { url = "*.json", run = "duckdb" },
  { url = "*.parquet", run = "duckdb" },
  { url = "*.xlsx", run = "duckdb" },
  { url = "*.db", run = "duckdb" },
  { url = "*.duckdb", run = "duckdb" },
  # { url = "*.txt", run = "duckdb" },
  # { mime = "image/{jpeg,png,webp}", run = "zoom 5" }, # currently not working reliably.
]

prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]

prepend_preloaders = [
  { url = "*.csv", run = "duckdb", multi = false },
  { url = "*.tsv", run = "duckdb", multi = false },
  { url = "*.json", run = "duckdb", multi = false },
  { url = "*.parquet", run = "duckdb", multi = false },
  { url = "*.xlsx", run = "duckdb", multi = false },
  # { url = "*.txt", run = "duckdb", multi = false },
]
